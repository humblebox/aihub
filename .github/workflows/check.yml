name: 部署脚本检查
on: [push, pull_request, workflow_dispatch]
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install PyYAML==6.0.3
      - run: bash -n scripts/install.sh
      - run: python -m compileall -q scripts deployment/aliyun-harness tests
      - run: node --check deployment/aliyun-harness/web-enrollment/index.mjs && node --check deployment/aliyun-harness/web-enrollment/client.js
      - run: python -m unittest discover -s tests -v
