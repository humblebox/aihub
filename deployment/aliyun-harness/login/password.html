<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>修改登录密码</title><style>body{font:16px system-ui;background:#f4f5fa;color:#272b3e;display:grid;place-items:center;min-height:95vh;margin:0;padding:18px;box-sizing:border-box}main{background:white;border:1px solid #e4e5ee;padding:32px;border-radius:18px;width:min(360px,85vw)}h1{margin:0}p{color:#73778b}label{display:block;margin:18px 0 6px}input,button{box-sizing:border-box;width:100%;font:inherit;border-radius:9px;padding:12px;border:1px solid #d9dce8}button{margin-top:24px;background:#6552cb;color:white;border:0;cursor:pointer}.error{color:#b33c4a}</style><main><h1>修改登录密码</h1><p>修改后所有设备需要重新登录，新密码不保存明文。</p><p class="error" role="alert"><!-- MESSAGE --></p><form method="post" action="/account/password"><!-- CSRF --><label for="old">旧密码</label><input id="old" name="old" type="password" autocomplete="current-password" required><label for="new">新密码（位数不限，不能为空）</label><input id="new" name="new" type="password" minlength="1" autocomplete="new-password" required><label for="confirm">再次输入新密码</label><input id="confirm" name="confirm" type="password" minlength="1" autocomplete="new-password" required><button>修改密码</button></form></main></html>
